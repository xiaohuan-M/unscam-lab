name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node }}'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: unscam-lab-static
          path: dist/
